 <div class="water water-back">

  <div class="cannonball cannonball-left"></div>

<div class="muzzle-flash flash-right"></div>

<script>
  const targets = document.querySelectorAll(".nav-logo, nav a");
  let coinInterval;

  function makeCoin(target) {
    const coin = document.createElement("span");
    coin.classList.add("coin");
    coin.textContent = "●";

    const rect = target.getBoundingClientRect();
    const randomLeft = rect.left + Math.random() * rect.width;

    coin.style.left = randomLeft + "px";
    coin.style.top = rect.top - 30 + "px";

    document.body.appendChild(coin);

    setTimeout(() => {
      coin.remove();
    }, 1100);
  }

  targets.forEach(target => {
    target.addEventListener("mouseenter", () => {
      coinInterval = setInterval(() => makeCoin(target), 120);
    });

    target.addEventListener("mouseleave", () => {
      clearInterval(coinInterval);
    });
  });
</script>

<script>
  const leftBall = document.querySelector(".cannonball-left");
  const rightBall = document.querySelector(".cannonball-right");
  const leftFlash = document.querySelector(".flash-left");
const rightFlash = document.querySelector(".flash-right");

  let nextSide = "left";

  function fireCannonball(side) {
  const ball = side === "left" ? leftBall : rightBall;
  const flash = side === "left" ? leftFlash : rightFlash;

  flash.style.opacity = "1";

  setTimeout(() => {
    flash.style.opacity = "0";
  }, 120);

    let x = side === "left" ? 40 : window.innerWidth - 58;
    let y = window.innerHeight - 60;

    let vx = side === "left" ? 15 : -15;
let vy = -6;
let gravity = 0.16;

    ball.style.opacity = "1";

    function animate() {
      x += vx;
      y += vy;
      vy += gravity;

      ball.style.left = x + "px";
      ball.style.top = y + "px";

      if (y > window.innerHeight - 10 || x < -50 || x > window.innerWidth + 50) {
        ball.style.opacity = "0";
        return;
      }

      requestAnimationFrame(animate);
    }

    animate();
  }

  function cannonLoop() {
    fireCannonball(nextSide);

    nextSide = nextSide === "left" ? "right" : "left";

    const delay = 5000 + Math.random() * 5000;
    setTimeout(cannonLoop, delay);
  }

  setTimeout(cannonLoop, 1500);
</script>

</body>
</html>
